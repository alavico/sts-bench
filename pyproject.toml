[project]
name = "sts-bench"
version = "0.1.0"
description = "A model-agnostic harness for having LLMs play Slay the Spire."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    # Reference-only since M1 (our own connection layer talks to CommunicationMod);
    # still imported by main.py and `console.py --auto`. Not on PyPI; pinned by git ref.
    "python-dotenv>=1.2.2",
    "spirecomm",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
spirecomm = { git = "https://github.com/ForgottenArbiter/spirecomm.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sts_bench"]
